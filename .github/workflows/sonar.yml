name: SonarQube Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Обязательно для истории коммитов

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Генерирует coverage/lcov.info
        run: npx jest --coverage --coverageProvider=v8

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v5
        env:
          # Секреты (должны быть в GitHub Settings)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          # Передаем настройки напрямую в сканер через args
          args: >-
            -Dsonar.projectKey=hexlet-code-serdarsabreder-frontend-project-46
            -Dsonar.organization=hexlet-code
            -Dsonar.projectName="Gendiff Project"
            -Dsonar.sources=src
            -Dsonar.tests=__tests__
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.language=js

