name: SonarQube Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Обязательно для истории коммитов

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Создает coverage/lcov.info
        run: npx jest --coverage --coverageProvider=v8

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          # Твой полный ключ проекта (не меняй!)
          projectKey: hexlet-code-serdarsabreder-frontend-project-46
          
          # 👇 ЭТА СТРОКА КРИТИЧЕСКИ ВАЖНА. Без неё будет та самая ошибка.
          organization: serdarsabreder
          
          projectName: "Gendiff Project"
          extraProperties: |
            sonar.sources=src
            sonar.tests=__tests__
            sonar.javascript.lcov.reportPaths=coverage/lcov.info
            sonar.language=js

