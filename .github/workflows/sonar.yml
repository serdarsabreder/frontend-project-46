name: SonarQube Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Обязательно: полный git-лог

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Генерирует coverage/lcov.info
        run: npx jest --coverage --coverageProvider=v8

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v5
        env:
          # ⚠️ ГЛАВНОЕ ИЗМЕНЕНИЕ: Все параметры теперь тут, с префиксом SONAR_
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          
          # Эти строки решают твою ошибку!
          SONAR_PROJECT_KEY: hexlet-code-serdarsabreder-frontend-project-46
          SONAR_ORGANIZATION: serdarsabreder
          SONAR_PROJECT_NAME: "Gendiff Project"
          
          # Настройки путей
          SONAR_SOURCES: src
          SONAR_TESTS: __tests__
          SONAR_JAVASCRIPT_LCOV_REPORT_PATHS: coverage/lcov.info
          SONAR_LANGUAGE: js
        with:
          # В этой версии экшена блок 'with' почти не нужен, можно оставить пустым или удалить
          args: '' 

